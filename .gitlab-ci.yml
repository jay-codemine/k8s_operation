# Go 项目 Docker Runner 示例
# 说明：
# 1) 编译与镜像构建分开：先在 Go 镜像中编译二进制，再在 Docker CLI 镜像中构建并推送镜像。
# 2) 通过 artifacts 传递编译产物，避免在镜像构建阶段重复编译。
# 3) Docker-in-Docker 依赖 DOCKER_HOST / DOCKER_TLS_CERTDIR 两个变量。

workflow:
  rules:
    # 允许在 GitLab 页面手动触发流水线，便于测试与排障
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # 打 tag 时触发正式发布
    - if: '$CI_COMMIT_TAG'
    # 其他情况默认不触发；开发团队可按项目需要自行补充分支规则
    - when: never

stages:
  - build
  - deploy

variables:
  DOCKER_HUB_URL: swr.cn-east-2.myhuaweicloud.com
  HARBOR_URL: harbor.maitian-yun.com
  DOCKER_HUB_ORG: foxess
  #REPOSITORY_NAME 为项目名称
  REPOSITORY_NAME: devops-be
  FE_NAME: devops-fe

  # Docker-in-Docker 必备配置：docker cli 通过 unix socket 连接 dind 服务
  DOCKER_HOST: "unix:///runner/services/docker/docker.sock"
  # 关闭 dind 的 TLS 目录，避免默认 TLS 配置导致连接失败
  DOCKER_TLS_CERTDIR: ""

default:
  tags:
    # 指定运行在 Docker Runner 上
    - docker
    - ubuntu22

compile-job:
  stage: build
  # 使用公司 Harbor 中的 Go 基础镜像，避免每次从外网拉取
  image: harbor.maitian-yun.com/base/golang:1.25.8
  before_script:
    # 以下步骤示例了如何在构建前拉取额外依赖仓库，建议后续改成私有仓库mod，直接使用go mod拉取
    - rm -rf ../library/
    - git config --list
    - git clone https://gitlab.maitian-yun.com/basic/go/toolbox.git ../library/toolbox
    - git clone git@gitlab.maitian-yun.com:basic/go/toolbox.git ../library/toolbox2
    - echo "pwd"
    - pwd


  script:
    - echo "compile build"
    - git version
    - go env
    - go mod tidy
    - go clean
    - mkdir -p bin
    - CGO_ENABLED=0 go build -trimpath -o "bin/$REPOSITORY_NAME" ./cmd/k8soperation
    - ls -la bin/
    - echo "PROJECT_NAME=$REPOSITORY_NAME"
    - test -f "bin/$REPOSITORY_NAME"
  artifacts:
    expire_in: 1 day
    paths:
      # 将编译产物传递给后续镜像构建任务
      - bin/$REPOSITORY_NAME

fe-compile-job:
  stage: build
  image: node:20-alpine
  before_script:
    - cd k8s-web
    - npm config set registry https://registry.npmmirror.com
  script:
    - npm ci
    - npm run build
    - test -d dist/
  artifacts:
    expire_in: 1 day
    paths:
      - k8s-web/dist/

docker-latest:
  stage: deploy
  # 镜像构建阶段使用 docker cli 镜像，而不是 Go 镜像
  image: harbor.maitian-yun.com/base/docker:24.0.5-cli
  services:
    # dind 提供 Docker Daemon
    - name: harbor.maitian-yun.com/base/docker:24.0.5-dind
      alias: docker
  dependencies:
    # 只下载 compile-job 的 artifacts，减少无关文件传递
    - compile-job
  script:
    - test -f "bin/$REPOSITORY_NAME"
    - echo "docker build latest for test"
    - docker build -t "$HARBOR_URL/$DOCKER_HUB_ORG/$REPOSITORY_NAME:latest" .
    - docker push "$HARBOR_URL/$DOCKER_HUB_ORG/$REPOSITORY_NAME:latest"
    - docker image rm "$HARBOR_URL/$DOCKER_HUB_ORG/$REPOSITORY_NAME:latest" -f
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

fe-docker-latest:
  stage: deploy
  image: harbor.maitian-yun.com/base/docker:24.0.5-cli
  services:
    - name: harbor.maitian-yun.com/base/docker:24.0.5-dind
      alias: docker
  dependencies:
    - fe-compile-job
  script:
    - cd k8s-web
    - test -d dist/
    - docker build -t "$HARBOR_URL/$DOCKER_HUB_ORG/$FE_NAME:latest" .
    - docker push "$HARBOR_URL/$DOCKER_HUB_ORG/$FE_NAME:latest"
    - docker image rm "$HARBOR_URL/$DOCKER_HUB_ORG/$FE_NAME:latest" -f
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

prod-deploy:
  stage: deploy
  image: harbor.maitian-yun.com/base/docker:24.0.5-cli
  services:
    - name: harbor.maitian-yun.com/base/docker:24.0.5-dind
      alias: docker
  dependencies:
    - compile-job
  script:
    - test -f "bin/$REPOSITORY_NAME"
    - echo "docker build for prod"
    - docker build -t "$DOCKER_HUB_URL/$DOCKER_HUB_ORG/$REPOSITORY_NAME:$CI_COMMIT_TAG" .
    - docker push "$DOCKER_HUB_URL/$DOCKER_HUB_ORG/$REPOSITORY_NAME:$CI_COMMIT_TAG"
    - docker image rm "$DOCKER_HUB_URL/$DOCKER_HUB_ORG/$REPOSITORY_NAME:$CI_COMMIT_TAG" -f
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success

fe-prod-deploy:
  stage: deploy
  image: harbor.maitian-yun.com/base/docker:24.0.5-cli
  services:
    - name: harbor.maitian-yun.com/base/docker:24.0.5-dind
      alias: docker
  dependencies:
    - fe-compile-job
  script:
    - cd k8s-web
    - test -d dist/
    - docker build -t "$DOCKER_HUB_URL/$DOCKER_HUB_ORG/$FE_NAME:$CI_COMMIT_TAG" .
    - docker push "$DOCKER_HUB_URL/$DOCKER_HUB_ORG/$FE_NAME:$CI_COMMIT_TAG"
    - docker image rm "$DOCKER_HUB_URL/$DOCKER_HUB_ORG/$FE_NAME:$CI_COMMIT_TAG" -f
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
