# ============================================================
# K8sOperation 后端 Service - NodePort 模式（仅供调试，生产禁用）
# ⚠️ 安全提醒：后端不应直接对外暴露，请使用前端 Nginx 反向代理访问
# 访问方式：http://<任意节点IP>:30081
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: k8soperation-backend-np
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: k8soperation
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30083          # 避免与 Jenkins(30080)、前端(30007) 冲突
      protocol: TCP
