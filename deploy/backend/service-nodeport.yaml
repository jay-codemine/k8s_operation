# ============================================================
# K8sOperation Service - NodePort 模式
# 用途：无 Ingress Controller 时，直接通过 NodePort 暴露服务
# 访问：http://<任意节点IP>:30080
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: k8soperation-nodeport
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: k8soperation
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080          # 固定端口，范围 30000-32767
      protocol: TCP
