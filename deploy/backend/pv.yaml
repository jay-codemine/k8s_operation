# ============================================================
# 后端 PV — NFS 共享存储
# 使用前修改 NFS Server IP（当前占位 10.0.16.2）
# ============================================================

apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-artifacts
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: artifact-storage
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 10.0.16.2          # ← 改成你的 NFS Server IP
    path: /data/k8soperation/artifacts
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-logs
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: log-storage
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 10.0.16.2
    path: /data/k8soperation/logs
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-agents
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: agent-storage
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 10.0.16.2
    path: /data/k8soperation/agents
