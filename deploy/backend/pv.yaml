# ============================================================
# PV：制品 + 日志 + 探针存储（NFS 共享存储）
# 使用前修改 NFS_SERVER 和 path 为你的实际 NFS 地址
# ============================================================

# ---- 制品存储（构建产物 JAR/二进制/tar.gz）----
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-artifacts
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: artifact-storage
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100          # ← 改为你的 NFS Server IP
    path: /nfs/k8soperation/artifacts

---
# ---- 日志存储（应用运行日志）----
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-logs
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: log-storage
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100          # ← 改为你的 NFS Server IP
    path: /nfs/k8soperation/logs

---
# ---- 探针存储（SkyWalking Agent 等 APM 探针文件）----
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-agents
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: agent-storage
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100          # ← 改为你的 NFS Server IP
    path: /nfs/k8soperation/agents
