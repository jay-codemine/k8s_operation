# ============================================================
# PV：制品 + 日志 + 探针存储
# 默认 hostPath，迁移 NFS 时取消 nfs 注释并注释 hostPath
# ============================================================

# ---- 制品存储（构建产物 JAR/二进制/tar.gz）----
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-artifacts
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: artifact-storage
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /data/k8soperation/artifacts
    type: DirectoryOrCreate
  # ==== NFS 方式 ====
  # nfs:
  #   server: 192.168.1.100
  #   path: /nfs/k8soperation/artifacts

---
# ---- 日志存储（应用运行日志）----
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-logs
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: log-storage
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /data/k8soperation/logs
    type: DirectoryOrCreate
  # nfs:
  #   server: 192.168.1.100
  #   path: /nfs/k8soperation/logs

---
# ---- 探针存储（SkyWalking Agent 等 APM 探针文件）----
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8soperation-agents
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: agent-storage
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /data/k8soperation/agents
    type: DirectoryOrCreate
  # nfs:
  #   server: 192.168.1.100
  #   path: /nfs/k8soperation/agents
