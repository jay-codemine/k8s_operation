# ============================================================
# K8sOperation 后端 Secret
# ------------------------------------------------------------
# ⚠️ 本文件已在 .gitignore 中忽略（含敏感信息，禁止提交）
# 部署前请把所有 CHANGE_ME_* 替换为真实值。
#
# 使用 stringData 明文书写，K8s 会自动 base64 编码，无需手动 encode。
# deployment.yaml 通过 secretKeyRef 从名为 k8soperation-secret 的
# Secret 注入以下全部 key（缺任一必填项 Pod 将无法启动）。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: k8soperation-secret
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # ===== 数据库（必填）=====
  DB_TYPE: "mysql"
  DB_USERNAME: "root"
  DB_PASSWORD: "123456"
  DB_HOST: "1.117.227.207"                            # 远程 MySQL 公网地址
  DB_PORT: "30306"
  DB_NAME: "k8s-platform"
  DB_CHARSET: "utf8mb4"
  DB_PARSE_TIME: "true"
  DB_MAX_IDLE_CONNS: "5"
  DB_MAX_OPEN_CONNS: "100"
  DB_MAX_LIFE_SECONDS: "300"

  # ===== 缓存 / Redis（必填）=====
  CACHE_TYPE: "redis"
  CACHE_NAME: "sk_sid"
  REDIS_ADDRESS: "1.117.227.207:6379"                  # 远程 Redis 公网地址
  REDIS_PASSWORD: "123456"
  CACHE_USERNAME: "root"
  CACHE_MAX_CONNECT: "10"
  CACHE_NETWORK: "tcp"
  CACHE_SECRET: "k8smana"

  # ===== 安全密钥（必填）=====
  JWT_SIGNING_KEY: "TJBAR7FCK9"
  HMAC_SECRET: "a9XkP7mQ2vNc8Lr4TzY6HwFd3BjUs5Ge"
  KUBECONFIG_ENCRYPT_KEY: "AR5679CTUE"

  # ===== Jenkins 联动（必填）=====
  JENKINS_URL: "http://jenkins.devops.svc.cluster.local:8080/"
  JENKINS_USERNAME: "admin"
  JENKINS_API_TOKEN: "116161c2077284adda0a64fd988bea3c68"

  # ===== 可选项 =====
  DEFAULT_IMAGE_REGISTRY: "registry.cn-hangzhou.aliyuncs.com/k8s-gos"
  PLATFORM_FRONTEND_URL: "http://k8soperation-frontend.k8soperation.svc.cluster.local"
  GIT_CREDENTIAL_ID: "gitee-id"
  REGISTRY_CREDENTIAL_ID: "harbor-registry"
  HMAC_CREDENTIAL_ID: "hmac-secret"
  GIT_USERNAME: ""
  GIT_TOKEN: ""
  ENABLE_DINGTALK: "false"
  DINGTALK_WEBHOOK: "xxxx"
  ENABLE_FEISHU: "false"
  FEISHU_WEBHOOK: ""
  FEISHU_SECRET: ""
  AI_API_KEY: "sk-b581fc675d9b4407897b4fac462cc9af"   # DeepSeek API Key
