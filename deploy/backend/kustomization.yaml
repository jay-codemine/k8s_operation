# ============================================================
# K8sOperation 后端 - Kustomization
# 一键部署：kubectl apply -k deploy/backend/
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8soperation

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pv.yaml                # PV 必须在 PVC 之前（hostPath 需节点上存在对应目录）
  - pvc.yaml               # PVC 依赖 PV
  - service.yaml
  - deployment.yaml
  # 对外暴露（二选一，生产环境推荐 Ingress）
  # - service-nodeport.yaml  # NodePort（无需 Ingress Controller）
  # - ingress.yaml           # Ingress（需 nginx-ingress）

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: k8soperation-platform
    includeSelectors: false
