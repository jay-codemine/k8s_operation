# ============================================================
# K8sOperation 后端 - Kustomization
# 一键部署：kubectl apply -k deploy/backend/
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8soperation

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  # - pv.yaml                # 按需取消注释                # PV 必须在 PVC 之前
  # - pvc.yaml               # 按需取消注释
  - service.yaml
  - deployment.yaml
#  - service-nodeport.yaml  # 按需取消注释（NodePort 暴露
  # - ingress.yaml           # 按需取消注释（Ingress 暴露）

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: k8soperation-platform
    includeSelectors: false
