# ============================================================
# K8sOperation 外部中间件模式 - 前端 Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: k8soperation-web
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation-web
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: k8soperation-web
---
# ============================================================
# NodePort Service（可选 - 无 Ingress 时直接暴露）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: k8soperation-web-nodeport
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation-web
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
  selector:
    app.kubernetes.io/name: k8soperation-web
