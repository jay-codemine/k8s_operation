# ============================================================
# K8sOperation 外部中间件模式 - ConfigMap
# 说明：MySQL 和 Redis 均使用外部服务（非 K8s 内部署）
#       Redis 使用 Cluster 集群模式
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8soperation-config
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation
data:
  config.yaml: |
    Server:
      RunMode: release
      Port: 8080
      ReadTimeout: 3600
      WriteTimeout: 3600
      IdleTimeout: 300
      ShutdownTimeout: 300

    Database:
      DBType: mysql
      Username: root
      Password: "${DB_PASSWORD}"
      Host: 192.168.1.100              # ← 外部 MySQL 地址
      Port: "3306"
      DBName: k8s-platform
      Charset: utf8
      ParseTime: true
      MaxIdleConns: 10
      MaxOpenConns: 100
      MaxLifeSeconds: 300

    Cache:
      Type: redis
      Name: sk_sid
      Address: ""                       # 留空（Cluster 模式不使用单节点地址）
      Addresses:                        # ← Redis Cluster 外部节点地址
        - 192.168.1.201:6379
        - 192.168.1.202:6379
        - 192.168.1.203:6379
        - 192.168.1.204:6379
        - 192.168.1.205:6379
        - 192.168.1.206:6379
      Username: ""
      Password: "${REDIS_PASSWORD}"
      MaxConnect: 20
      Network: tcp
      Secret: "k8smana"

    App:
      LogLevel: info
      TIMEZONE: "Asia/Shanghai"
      LogType: single
      LogFileName: storage/logs/app.log
      BusinessLogFileName: storage/logs/biz.log
      LogMaxSize: 50
      LogMaxBackup: 5
      LogMaxAge: 30
      LogCompress: true
      MirrorBusinessToSystem: false
      JWTMaxRefreshTime: 86400
      JWTSigningKey: "${JWT_SIGNING_KEY}"
      JWTExpireTime: 120000
      AppName: "k8soperation"
      GlobalKubeConfigPath: ""
      DefaultClusterID: 0
      AutoInitK8s: true
      AllowEmptyStart: true

    PodLog:
      EnableStreaming: false
      TailDefault: 500
      TailMax: 5000
      LimitBytes: 2097152
      Timestamps: false
      Previous: false

    ErrorCode:
      AllowOverride: false

    ClusterClient:
      TTL: 30m
      TTLJitter: 3m

    Pod:
      eviction:
        default_grace_seconds: 30

    Node:
      drain:
        max_grace_seconds: 300
        ignore_daemon_sets: true
        delete_empty_dir: false

    Jenkins:
      URL: "${JENKINS_URL}"
      Username: "${JENKINS_USERNAME}"
      APIToken: "${JENKINS_API_TOKEN}"
      TriggerTimeout: 60
      CallbackURL: "http://k8soperation.k8soperation.svc:8080"
      PlatformURL: "${PLATFORM_FRONTEND_URL}"
      HMACSecret: "${HMAC_SECRET}"
      PollInterval: 15
      MaxBuildTime: 30
      DingTalkWebhook: "${DINGTALK_WEBHOOK}"

    Security:
      KubeConfigEncryptKey: "${KUBECONFIG_ENCRYPT_KEY}"
      PasswordBcryptCost: 10
      AutoEncryptLegacyData: true

    AIAssistant:
      Enabled: false
      DefaultProvider: "qwen"
      SystemPrompt: "你是 K8s 管理平台的 AI 助手，擅长 Kubernetes 集群管理、资源运维、故障诊断。请用中文回复，简洁专业。"
      ApprovalExpire: 30
      MaxHistoryRound: 20
