# ============================================================
# K8sOperation 外部中间件模式 - PVC
# 说明：只需要应用自身的制品和日志存储
#       MySQL/Redis 均为外部服务，无需 K8s PVC
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8soperation-artifacts
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: artifact-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8soperation-logs
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: log-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
