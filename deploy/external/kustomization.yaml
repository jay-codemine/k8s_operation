# ============================================================
# K8sOperation 外部中间件模式 - Kustomization
# 适用场景：MySQL 和 Redis 为外部服务（非 K8s 内部署）
#           Redis 使用 Cluster 集群模式
#
# 一键部署：kubectl apply -k deploy/external/
#
# 使用前修改：
#   1. configmap.yaml → Database.Host 改为实际外部 MySQL 地址
#   2. configmap.yaml → Cache.Addresses 改为实际 Redis Cluster 节点
#   3. secret.yaml → DB_PASSWORD / REDIS_PASSWORD 替换为实际 base64 编码值
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8soperation

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: k8soperation-platform
