# ============================================================
# K8sOperation 前端 - Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8soperation-web
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2                                # 前端无状态，可多副本
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8soperation-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8soperation-web
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: aliyun-registry
      containers:
        - name: devops-fe
          image: registry.cn-hangzhou.aliyuncs.com/k8s-gos/devops-fe:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: API_BACKEND_URL
              value: "http://k8soperation.k8soperation.svc:8080"

          # 存活探针
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

          # 就绪探针
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # 资源限制
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # 挂载 Nginx 配置（可选，镜像内置了默认配置）
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:
        - name: nginx-config
          configMap:
            name: k8soperation-web-nginx
            optional: true           # 如果 ConfigMap 不存在则使用镜像内置配置
