# ============================================================
# K8sOperation 前端 - Service (NodePort)
# 使用场景：无 Ingress Controller 时直接通过节点端口暴露前端
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: k8soperation-web-nodeport
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation-web
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082            # ← 可自定义端口（30000-32767）
      protocol: TCP
  selector:
    app.kubernetes.io/name: k8soperation-web
