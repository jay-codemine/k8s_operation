# ============================================================
# K8sOperation 本地验证部署 - All-in-One
# 适用场景：Docker Desktop Kubernetes 本地验证
# 使用方式：kubectl apply -f deploy/local-test/all-in-one.yaml
# 访问地址：
#   前端：http://localhost:30080
#   后端：http://localhost:30880/healthz/live
# 清理：kubectl delete -f deploy/local-test/all-in-one.yaml
# ============================================================

# ==================== Namespace ====================
apiVersion: v1
kind: Namespace
metadata:
  name: k8soperation
  labels:
    app.kubernetes.io/part-of: k8soperation-platform
---

# ==================== ServiceAccount + RBAC ====================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8soperation
  namespace: k8soperation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8soperation
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "configmaps", "secrets", "persistentvolumes", "persistentvolumeclaims", "nodes", "namespaces", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8soperation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8soperation
subjects:
  - kind: ServiceAccount
    name: k8soperation
    namespace: k8soperation
---

# ==================== Secret ====================
apiVersion: v1
kind: Secret
metadata:
  name: k8soperation-secret
  namespace: k8soperation
type: Opaque
stringData:
  DB_PASSWORD: "test123456"
  REDIS_PASSWORD: "test123456"
  JWT_SIGNING_KEY: "local-test-jwt-key-2024"
  JENKINS_URL: "http://localhost:8080"
  JENKINS_USERNAME: "admin"
  JENKINS_API_TOKEN: "test-token"
  HMAC_SECRET: "local-test-hmac-secret"
  KUBECONFIG_ENCRYPT_KEY: "0123456789abcdef0123456789abcdef"
---

# ==================== Backend ConfigMap ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8soperation-config
  namespace: k8soperation
data:
  config.yaml: |
    Server:
      RunMode: release
      Port: 8080
      ReadTimeout: 3600
      WriteTimeout: 3600
      IdleTimeout: 300
      ShutdownTimeout: 300

    Database:
      DBType: mysql
      Username: root
      Password: "${DB_PASSWORD}"
      Host: host.docker.internal
      Port: "3306"
      DBName: k8s-platform
      Charset: utf8
      ParseTime: true
      MaxIdleConns: 10
      MaxOpenConns: 100
      MaxLifeSeconds: 300

    Cache:
      Type: redis
      Name: sk_sid
      Address: host.docker.internal:6379
      Addresses: []
      Username: ""
      Password: "${REDIS_PASSWORD}"
      MaxConnect: 10
      Network: tcp
      Secret: "k8smana"

    App:
      LogLevel: info
      TIMEZONE: "Asia/Shanghai"
      LogType: single
      LogFileName: storage/logs/app.log
      BusinessLogFileName: storage/logs/biz.log
      LogMaxSize: 50
      LogMaxBackup: 5
      LogMaxAge: 30
      LogCompress: false
      MirrorBusinessToSystem: false
      JWTMaxRefreshTime: 86400
      JWTSigningKey: "${JWT_SIGNING_KEY}"
      JWTExpireTime: 120000
      AppName: "k8soperation"
      GlobalKubeConfigPath: ""
      DefaultClusterID: 0
      AutoInitK8s: true
      AllowEmptyStart: true

    PodLog:
      EnableStreaming: false
      TailDefault: 500
      TailMax: 5000
      LimitBytes: 2097152
      Timestamps: false
      Previous: false

    ErrorCode:
      AllowOverride: false

    ClusterClient:
      TTL: 30m
      TTLJitter: 3m

    Pod:
      eviction:
        default_grace_seconds: 30

    Node:
      drain:
        max_grace_seconds: 300
        ignore_daemon_sets: true
        delete_empty_dir: false

    Jenkins:
      URL: "${JENKINS_URL}"
      Username: "${JENKINS_USERNAME}"
      APIToken: "${JENKINS_API_TOKEN}"
      TriggerTimeout: 60
      CallbackURL: "http://k8soperation.k8soperation.svc:8080"
      PlatformURL: "http://localhost:30080"
      HMACSecret: "${HMAC_SECRET}"
      PollInterval: 15
      MaxBuildTime: 30

    Security:
      KubeConfigEncryptKey: "${KUBECONFIG_ENCRYPT_KEY}"
      PasswordBcryptCost: 10
      AutoEncryptLegacyData: true

    AIAssistant:
      Enabled: false
      DefaultProvider: "qwen"
      SystemPrompt: "你是 K8s 管理平台的 AI 助手"
      ApprovalExpire: 30
      MaxHistoryRound: 20
---

# ==================== Backend Deployment ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8soperation
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8soperation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8soperation
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: k8soperation
      containers:
        - name: k8soperation
          image: k8soperation:latest
          imagePullPolicy: Never          # ← 使用本地 Docker 镜像
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GIN_MODE
              value: "release"
            - name: APP_CONFIG
              value: "/app/configs/config.yaml"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8soperation-secret
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8soperation-secret
                  key: REDIS_PASSWORD
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: k8soperation-secret
                  key: JWT_SIGNING_KEY
            - name: JENKINS_URL
              valueFrom:
                secretKeyRef:
                  name: k8soperation-secret
                  key: JENKINS_URL
            - name: JENKINS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k8soperation-secret
                  key: JENKINS_USERNAME
            - name: JENKINS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8soperation-secret
                  key: JENKINS_API_TOKEN
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: k8soperation-secret
                  key: HMAC_SECRET
            - name: KUBECONFIG_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: k8soperation-secret
                  key: KUBECONFIG_ENCRYPT_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: k8soperation-config
---

# ==================== Backend Service (NodePort) ====================
apiVersion: v1
kind: Service
metadata:
  name: k8soperation
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30880                     # ← 后端 NodePort
      protocol: TCP
  selector:
    app.kubernetes.io/name: k8soperation
---

# ==================== Frontend Deployment ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8soperation-web
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8soperation-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8soperation-web
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: web
          image: k8soperation-web:latest
          imagePullPolicy: Never          # ← 使用本地 Docker 镜像
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: API_BACKEND_URL
              value: "http://k8soperation.k8soperation.svc:8080"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---

# ==================== Frontend Service (NodePort) ====================
apiVersion: v1
kind: Service
metadata:
  name: k8soperation-web
  namespace: k8soperation
  labels:
    app.kubernetes.io/name: k8soperation-web
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080                     # ← 前端 NodePort
      protocol: TCP
  selector:
    app.kubernetes.io/name: k8soperation-web
