# ============================================================
# K8s 部署清单：Vue3 前端应用
# 项目：docker-vuejs-sample (Docker 官方 Vue.js 示例)
# ============================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vue-frontend
  namespace: demo
  labels:
    app: vue-frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vue-frontend
  template:
    metadata:
      labels:
        app: vue-frontend
        version: v1
    spec:
      containers:
        - name: nginx
          image: registry.cn-hangzhou.aliyuncs.com/your-ns/vue-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: vue-frontend-svc
  namespace: demo
spec:
  selector:
    app: vue-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP

---
# 如果集群有 Ingress Controller（如 nginx-ingress）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vue-frontend-ingress
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: vue-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vue-frontend-svc
                port:
                  number: 80
