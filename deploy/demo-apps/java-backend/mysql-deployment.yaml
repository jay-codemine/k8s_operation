# ============================================================
# K8s：MySQL 8.0 — 供 java-backend 使用
# ============================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-sql
  namespace: demo
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS db
      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: demo
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root123"
  MYSQL_USER: "root"
  MYSQL_PASSWORD: "123456"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: demo
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql-secret
          env:
            - name: MYSQL_DATABASE
              value: db
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - 'mysql -uroot -p$MYSQL_PASSWORD -e "SELECT 1" db'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-init
          configMap:
            name: mysql-init-sql

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: demo
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
