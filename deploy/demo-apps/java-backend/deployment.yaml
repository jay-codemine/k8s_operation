# ============================================================
# K8s 部署清单：多模块 Spring Boot 后端
# 项目：educostadev/Designing-Hexagonal-Architecture-with-Java-SpringBoot
# 模块：domain / application / infrastructure / bootstrap
# 配置：bootstrap/src/main/resources/application.yml
# ============================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: java-backend-config
  namespace: demo
data:
  # 不设 spring.profiles.active，走默认 application.yml
  # 指向集群已有 MySQL（外部地址，如用 K8s 内部 MySQL 则改为 mysql-svc:3306）
  SPRING_DATASOURCE_URL: "jdbc:mysql://1.117.227.207:30306/db?useSSL=false&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "root"
  SERVER_PORT: "8080"

---
apiVersion: v1
kind: Secret
metadata:
  name: java-backend-secret
  namespace: demo
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "123456"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-backend
  namespace: demo
  labels:
    app: java-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-backend
  template:
    metadata:
      labels:
        app: java-backend
        version: v1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: java-app
          image: registry.cn-hangzhou.aliyuncs.com/your-ns/java-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: java-backend-config
            - secretRef:
                name: java-backend-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          # 优先用 HTTP 探针（如果项目有 Actuator）
          # 否则会自动回退到 TCP 探针
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: java-backend-svc
  namespace: demo
spec:
  selector:
    app: java-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

---
# Ingress 可选：如果集群没有 nginx-ingress-controller 请删掉
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-backend-ingress
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
    - host: java-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-backend-svc
                port:
                  number: 8080
