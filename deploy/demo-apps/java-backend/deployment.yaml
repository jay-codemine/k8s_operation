# ============================================================
# K8s 部署清单：多模块 Spring Boot 后端
# 项目：Designing-Hexagonal-Architecture-with-Java-SpringBoot
# 模块：domain / application / infrastructure / bootstrap
# ============================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: java-backend-config
  namespace: demo
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-svc:3306/hexagonal_db?useSSL=false&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "app_user"
  SERVER_PORT: "8080"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"

---
apiVersion: v1
kind: Secret
metadata:
  name: java-backend-secret
  namespace: demo
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "your-password-here"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-backend
  namespace: demo
  labels:
    app: java-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-backend
  template:
    metadata:
      labels:
        app: java-backend
        version: v1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: java-app
          image: registry.cn-hangzhou.aliyuncs.com/your-ns/java-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: java-backend-config
            - secretRef:
                name: java-backend-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: java-backend-svc
  namespace: demo
spec:
  selector:
    app: java-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-backend-ingress
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: java-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-backend-svc
                port:
                  number: 8080
