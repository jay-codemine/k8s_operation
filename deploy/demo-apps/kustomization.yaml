# ============================================================
# Kustomize 一键部署 demo 命名空间下全部资源
# 用法：
#   kubectl create ns demo
#   kubectl apply -k deploy/demo-apps/
# ============================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - vue-frontend/deployment.yaml
  - java-backend/deployment.yaml
  - java-backend/mysql-deployment.yaml

commonLabels:
  managed-by: kustomize
  env: demo
