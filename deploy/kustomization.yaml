# ============================================================
# Kustomization - 一键部署所有资源（前端 + 后端）
# 使用方式：
#   kubectl apply -k deploy/           # 前后端全部署（K8s内MySQL+Redis）
#   kubectl apply -k deploy/backend/   # 仅后端（K8s内MySQL+Redis）
#   kubectl apply -k deploy/frontend/  # 仅前端
#   kubectl apply -k deploy/external/  # 外部MySQL + Redis Cluster 模式
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8soperation

resources:
  - backend/           # 后端（Namespace + Secret + ConfigMap + PVC + Service + Deployment）
  - frontend/          # 前端（Deployment + Service + Ingress）

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: k8soperation-platform
