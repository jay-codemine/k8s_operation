# ============================================================
# Kustomization - 一键部署所有资源（前端 + 后端 + 外部中间件）
# 使用方式：
#   kubectl apply -k deploy/           # 前后端全部署（外部 MySQL + Redis Cluster）
#   kubectl apply -k deploy/backend/   # 仅后端（K8s 内 MySQL + Redis）
#   kubectl apply -k deploy/frontend/  # 仅前端
#   kubectl apply -k deploy/external/  # 仅后端（外部 MySQL + Redis Cluster）
#
# 本地验证（Docker Desktop K8s + NodePort）：
#   kubectl apply -f deploy/local-test/all-in-one.yaml
#   或者：bash deploy/local-test/deploy.sh
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8soperation

resources:
  - external/          # 后端（外部 MySQL + Redis Cluster 模式）
  - frontend/          # 前端（Deployment + Service + Ingress）

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: k8soperation-platform
