# ============================================================
# Jenkins ConfigMap - JCasC (Jenkins Configuration as Code)
# 自动化配置 Kubernetes Cloud、安全策略、插件等
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc-config
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: master
data:
  casc.yaml: |
    jenkins:
      systemMessage: "K8s Operation Platform - Jenkins (Fully Containerized)"
      numExecutors: 0  # Master 不执行构建，全部交给动态 Pod Agent
      mode: EXCLUSIVE

      # 全局环境变量（解决 Pipeline 首次构建 params 不生效问题）
      globalNodeProperties:
        - envVars:
            env:
              - key: "PLATFORM_CALLBACK_URL"
                value: "http://k8soperation.k8soperation.svc:8080/api/v1/k8s/cicd/pipeline/callback"
              - key: "ARTIFACT_UPLOAD_URL"
                value: "http://k8soperation.k8soperation.svc:8080/api/v1/k8s/cicd/artifact/upload"

      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "ops-dev"
              password: "${JENKINS_ADMIN_PASSWORD}"

      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousRead: false

      clouds:
        - kubernetes:
            name: "kubernetes"
            serverUrl: "https://kubernetes.default.svc.cluster.local"
            namespace: "devops"
            jenkinsUrl: "http://jenkins.devops.svc.cluster.local:8080"
            jenkinsTunnel: "jenkins-agent.devops.svc.cluster.local:50000"
            connectTimeout: 5
            readTimeout: 15
            containerCapStr: "20"
            maxRequestsPerHostStr: "32"
            retentionTimeout: 5
            waitForPodSec: 600

    # 全局凭证（通过 K8s Secret 注入，重启不丢失）
    credentials:
      system:
        domainCredentials:
          - credentials:
              # HMAC 签名密钥（回调验签）
              - string:
                  scope: GLOBAL
                  id: "hmac-secret"
                  secret: "${HMAC_SECRET}"
                  description: "HMAC signing secret for platform callback"
              # SonarQube Token
              - string:
                  scope: GLOBAL
                  id: "sonarqube-token"
                  secret: "${SONAR_TOKEN}"
                  description: "SonarQube authentication token"
              # 镜像仓库凭证（阿里云 ACR / Harbor）
              - usernamePassword:
                  scope: GLOBAL
                  id: "harbor-registry"
                  username: "${REGISTRY_USERNAME}"
                  password: "${REGISTRY_PASSWORD}"
                  description: "Container registry credentials (Aliyun ACR)"
              # Git 凭证（Gitee）
              - usernamePassword:
                  scope: GLOBAL
                  id: "gitee-id"
                  username: "${GITEE_USERNAME}"
                  password: "${GITEE_PASSWORD}"
                  description: "Gitee Git credential (Personal Access Token)"
              # Maven 私有仓库凭证
              - usernamePassword:
                  scope: GLOBAL
                  id: "maven-private-repo"
                  username: "${MAVEN_REPO_USERNAME}"
                  password: "${MAVEN_REPO_PASSWORD}"
                  description: "Maven private repository credentials"

    # 必装插件
    unclassified:
      location:
        url: "http://jenkins.devops.svc.cluster.local:8080/"

      # ======== SonarQube 服务器配置 ========
      # 支持集群内部或外部的 SonarQube 实例
      # 外部地址示例: http://sonarqube.example.com:9000
      # 内部地址示例: http://sonarqube.devops.svc.cluster.local:9000
      sonarGlobalConfiguration:
        buildWrapperEnabled: true
        installations:
          - name: "SonarQube"                         # Pipeline 中 withSonarQubeEnv('SonarQube') 引用的名称
            serverUrl: "http://sonarqube.example.com:9000"  # ← 修改为你实际的 SonarQube 地址
            credentialsId: "sonarqube-token"           # Jenkins 凭证 ID（存储 SonarQube Token）
            webhookSecretId: ""                        # Quality Gate Webhook Secret（可选）
