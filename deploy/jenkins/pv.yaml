# ============================================================
# Jenkins PV — NFS 共享存储
# 使用前修改 NFS Server IP（当前占位 10.0.16.2）
# ============================================================

apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-data-pv
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: master
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: devops
    name: jenkins-data
  nfs:
    server: 10.0.16.2
    path: /data/nfs/jenkins/home
---
# Go 模块缓存
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-go-cache-pv
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: build-cache
    cache-type: go
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: devops
    name: jenkins-go-cache
  nfs:
    server: 10.0.16.2
    path: /data/nfs/jenkins/go-cache
