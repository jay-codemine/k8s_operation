# ============================================================
# Jenkins PVs
# 支持 hostPath（单机开发）和 NFS（多节点生产）
# 初次部署默认使用 hostPath，迁移 NFS 时参考下方注释
# ============================================================

# Jenkins 主数据（/var/jenkins_home：配置/插件/Job/构建历史）
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-data-pv
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: master
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: devops
    name: jenkins-data
  # ==== 方式一：hostPath（默认） ====
  hostPath:
    path: /data/jenkins/home
    type: DirectoryOrCreate
  # ==== 方式二：NFS（多节点集群）====
  # 迁移步骤：先拷贝数据 → 再切换
  #   cp -a /data/jenkins/home/* /nfs/jenkins/home/
  #   然后注释上面 hostPath，取消下面 nfs 注释
  # nfs:
  #   server: 192.168.1.100
  #   path: /nfs/jenkins/home
---
# Go 模块缓存
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-go-cache-pv
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: build-cache
    cache-type: go
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: devops
    name: jenkins-go-cache
  hostPath:
    path: /data/jenkins/go-cache
    type: DirectoryOrCreate
  # ==== NFS 方式 ====
  # nfs:
  #   server: 192.168.1.100
  #   path: /nfs/jenkins/go-cache
---
