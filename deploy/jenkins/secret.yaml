# ============================================================
# Jenkins Secret
# 存储敏感信息：管理员密码、HMAC 密钥、镜像仓库凭证、Git 凭证
# 部署前修改 base64 编码的值
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-secret
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: master
type: Opaque
data:
  # echo -n "admin123" | base64
  admin-password: YWRtaW4xMjM=
  # echo -n "a9XkP7mQ2vNc8Lr4TzY6HwFd3BjUs5Ge" | base64
  hmac-secret: YTlYa1A3bVEydk5jOExyNFR6WTZId0ZkM0JqVXM1R2U=
  # echo -n "your-sonarqube-token" | base64
  sonarqube-token: eW91ci1zb25hcnF1YmUtdG9rZW4=

  # ===== 镜像仓库凭证 (harbor-registry) =====
  # 阿里云容器镜像服务访问凭证
  # echo -n "15862326490" | base64
  registry-username: MTU4NjIzMjY0OTA=
  # echo -n "dc521521..0" | base64
  registry-password: ZGM1MjE1MjEuLjA=

  # ===== Git 凭证 (gitee-id) =====
  # Gitee Personal Access Token（OAuth2 方式，用户名固定为 oauth2）
  # echo -n "oauth2" | base64
  gitee-username: b2F1dGgy
  # echo -n "N8_PBsxnEufVqRGLZyFz" | base64
  gitee-password: TjhfUEJzeG5FdWZWcVJHTFp5Rno=

  # ===== Maven 私有仓库凭证 (maven-private-repo) =====
  # echo -n "admin" | base64
  maven-repo-username: YWRtaW4=
  # echo -n "your-maven-password" | base64  ← 替换为实际密码
  maven-repo-password: eW91ci1tYXZlbi1wYXNzd29yZA==
