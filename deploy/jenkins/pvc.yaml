# ============================================================
# Jenkins PVC - 持久化存储
# 包含：Jenkins 主数据 + 各语言构建缓存
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-data
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: master
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: ""  # 使用默认 StorageClass，按需修改
---
# Go 模块缓存
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-go-cache
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: build-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Maven 本地仓库缓存
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-maven-cache
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: build-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# npm 缓存
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-npm-cache
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: build-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# pip 缓存
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pip-cache
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: build-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
