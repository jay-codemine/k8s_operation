# ============================================================
# Jenkins StatefulSet
# 使用 StatefulSet 保证稳定的网络标识和持久化存储
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jenkins
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: master
spec:
  serviceName: jenkins
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/component: master
    spec:
      serviceAccountName: jenkins
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      initContainers:
        # 修复 hostPath 目录权限（以 root 运行）
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /var/jenkins_home
              chmod -R 775 /var/jenkins_home
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
      containers:
        - name: jenkins
          image: jenkins/jenkins:2.555.3-lts
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: agent
              containerPort: 50000
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: >-
                -Xms512m -Xmx2g
                -Djenkins.install.runSetupWizard=false
                -Dcasc.jenkins.config=/var/jenkins_home/casc_configs
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: admin-password
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: hmac-secret
            - name: SONAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: sonarqube-token
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: registry-username
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: registry-password
            - name: GITEE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: gitee-username
            - name: GITEE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: gitee-password
            - name: SONARQUBE_URL
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: sonarqube-url
                  optional: true
            - name: MAVEN_REPO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: maven-repo-username
            - name: MAVEN_REPO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: maven-repo-password
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
            - name: casc-config
              mountPath: /var/jenkins_home/casc_configs
              readOnly: true
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-data
        - name: casc-config
          configMap:
            name: jenkins-casc-config
