# ============================================================
# Jenkins StatefulSet
# 使用 StatefulSet 保证稳定的网络标识和持久化存储
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jenkins
  namespace: devops
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: master
spec:
  serviceName: jenkins
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/component: master
    spec:
      serviceAccountName: jenkins
      # 固定调度到 test-0 节点（hostPath PV 数据在该节点）
      nodeSelector:
        kubernetes.io/hostname: test-0
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      initContainers:
        # 1. 修复 hostPath 目录权限（以 root 运行）
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /var/jenkins_home
              chmod -R 775 /var/jenkins_home
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
        # 2. 预装必需插件（PVC 丢失时自动恢复，已有则跳过）
        - name: install-plugins
          image: jenkins/jenkins:2.555.3-lts
          command:
            - sh
            - -c
            - |
              # 如果插件目录已有内容（>5个文件），说明 PVC 数据完好，跳过安装
              PLUGIN_COUNT=$(ls /var/jenkins_home/plugins/*.jpi 2>/dev/null | wc -l)
              if [ "$PLUGIN_COUNT" -gt 5 ]; then
                echo "[init] 检测到 $PLUGIN_COUNT 个已安装插件，跳过预装"
                exit 0
              fi
              echo "[init] 插件目录为空，开始预装核心插件..."
              jenkins-plugin-cli --verbose --plugins \
                configuration-as-code \
                kubernetes \
                workflow-aggregator \
                pipeline-utility-steps \
                pipeline-stage-view \
                git \
                credentials-binding \
                http_request \
                throttle-concurrents \
                sonar \
                junit \
                antisamy-markup-formatter \
                matrix-auth
              echo "[init] 插件预装完成"
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
          securityContext:
            runAsUser: 1000
      containers:
        - name: jenkins
          image: jenkins/jenkins:2.555.3-lts
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: agent
              containerPort: 50000
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: >-
                -Xms512m -Xmx2g
                -Djenkins.install.runSetupWizard=false
                -Dcasc.jenkins.config=/var/jenkins_home/casc_configs
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: admin-password
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: hmac-secret
            - name: SONAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: sonarqube-token
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: registry-username
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: registry-password
            - name: GITEE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: gitee-username
            - name: GITEE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: gitee-password
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
            - name: casc-config
              mountPath: /var/jenkins_home/casc_configs
              readOnly: true
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-data
        - name: casc-config
          configMap:
            name: jenkins-casc-config
