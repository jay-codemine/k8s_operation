# Argo Workflow Template: Java Spring 项目 CI 构建
# 对应语言类型: java
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: java-spring-build-workflow
  namespace: argo
spec:
  entrypoint: java-build-pipeline
  arguments:
    parameters:
      - name: git_repo
      - name: git_branch
        value: "main"
      - name: image_registry
      - name: image_repo
      - name: pipeline_id
        value: "0"
      - name: run_id
        value: "0"
      - name: platform_callback_url
        value: ""
      - name: git_manifest_repo
        value: ""
      - name: manifest_path
        value: "manifests"
      - name: argo_app_name
        value: ""
      - name: language_type
        value: "java"
      - name: java_version
        value: "17"
  templates:
    - name: java-build-pipeline
      steps:
        - - name: checkout
            template: git-checkout
        - - name: build
            template: maven-build
        - - name: sonar
            template: sonar-scan
        - - name: build-image
            template: kaniko-build
        - - name: update-manifest
            template: git-update-manifest
        - - name: callback
            template: platform-callback
    - name: git-checkout
      container:
        image: alpine/git:latest
        command:
          - sh
          - -c
          - |
            git clone --depth 1 --branch {{workflow.parameters.git_branch}} {{workflow.parameters.git_repo}} /workspace
            cd /workspace && git rev-parse HEAD > /tmp/commit.txt
    - name: maven-build
      container:
        image: maven:3.9-{{workflow.parameters.java_version}}
        command: [sh, -c]
        args: ["cd /workspace && mvn clean package -DskipTests -B"]
    - name: sonar-scan
      container:
        image: sonarsource/sonar-scanner-cli:latest
        command: [sonar-scanner]
    - name: kaniko-build
      container:
        image: gcr.io/kaniko-project/executor:latest
        args:
          - --context=/workspace
          - --dockerfile=/workspace/Dockerfile
          - --destination={{workflow.parameters.image_registry}}/{{workflow.parameters.image_repo}}:{{workflow.parameters.git_branch}}-latest
    - name: git-update-manifest
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args: ["echo 'Manifest updated'"]
    - name: platform-callback
      container:
        image: curlimages/curl:latest
        command: [sh, -c]
        args: ["curl -X POST {{workflow.parameters.platform_callback_url}} -d '{\"pipeline_id\":{{workflow.parameters.pipeline_id}},\"run_id\":{{workflow.parameters.run_id}},\"status\":\"SUCCESS\"}'"]
