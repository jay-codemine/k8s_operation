Server:
  RunMode: release
  Port: 8080
  ReadTimeout: 3600
  WriteTimeout: 3600
  IdleTimeout: 300
  ShutdownTimeout: 300

Database:
  DBType: mysql
  Username: root
  Password: admin123
  Host: k8soperation-mysql
  Port: 3306
  DBName: k8s-platform
  Charset: utf8mb4
  ParseTime: true
  MaxIdleConns: 5
  MaxOpenConns: 100
  MaxLifeSeconds: 300

Cache:
  Type: redis
  Name: sk_sid
  Address: k8soperation-redis:6379
  Username: "default"
  Password: "admin123"
  MaxConnect: 10
  Network: tcp
  Secret: "k8smana"

App:
  LogLevel: debug
  TIMEZONE: "Asia/Shanghai"
  LogType: single
  LogFileName: storage/logs/app.log
  LogMaxSize: 1
  LogMaxBackup: 3
  LogMaxAge: 30
  LogCompress: true
  BusinessLogFileName: storage/logs/biz.log
  MirrorBusinessToSystem: false
  JWTMaxRefreshTime: 86400
  JWTSigningKey: test-signing-key
  JWTExpireTime: 120000
  AppName: "k8operation"
  GlobalKubeConfigPath: ""
  DefaultClusterID: 0
  AutoInitK8s: false
  AllowEmptyStart: true

PodLog:
  EnableStreaming: false
  TailDefault: 500
  TailMax: 5000
  LimitBytes: 2097152
  Timestamps: false
  Previous: false

ErrorCode:
  AllowOverride: true

ClusterClient:
  TTL: 30m
  TTLJitter: 3m

Pod:
  eviction:
    default_grace_seconds: 30

Node:
  drain:
    max_grace_seconds: 300
    ignore_daemon_sets: true
    delete_empty_dir: false

Jenkins:
  URL: "http://127.0.0.1:8080/"
  Username: "admin"
  APIToken: "test-token"
  TriggerTimeout: 60
  CallbackURL: "http://localhost:8080"
  PlatformURL: "http://localhost:30080"
  HMACSecret: "test-hmac-secret"
  PollInterval: 15
  MaxBuildTime: 30
  DingTalkWebhook: ""

Monitoring:
  Enabled: false
  PrometheusURL: ""
  QueryTimeout: 30

AIAssistant:
  Enabled: false
  APIKey: ""
  BaseURL: ""
  Model: "gpt-4o"
  MaxTokens: 2048
  Temperature: 0.7
  SystemPrompt: ""
  ApprovalExpire: 30
  MaxHistoryRound: 20
