---
# ============================================================
# 安装容器运行时（containerd）
# 所有节点执行
# ============================================================

# ---------- Debian/Ubuntu ----------
- name: 安装依赖包（Ubuntu）
  apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - apt-transport-https
    - ca-certificates
    - curl
    - gnupg
  when: ansible_os_family == "Debian"

- name: 添加 Docker 官方 GPG 密钥（Ubuntu）
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  when: ansible_os_family == "Debian"

- name: 添加 Docker APT 仓库（Ubuntu）
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  when: ansible_os_family == "Debian"

- name: 安装 containerd.io（Ubuntu）
  apt:
    name: containerd.io
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# ---------- RedHat/Rocky ----------
- name: 安装依赖包（Rocky）
  dnf:
    name: "{{ item }}"
    state: present
  loop:
    - yum-utils
    - device-mapper-persistent-data
    - lvm2
    - curl
  when: ansible_os_family == "RedHat"

- name: 添加 Docker 官方 YUM 仓库（Rocky）
  yum_repository:
    name: docker-ce
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg
  when: ansible_os_family == "RedHat"

- name: 安装 containerd.io（Rocky）
  dnf:
    name: containerd.io
    state: present
  when: ansible_os_family == "RedHat"

# ---------- 通用配置 ----------
- name: 创建 containerd 配置目录
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: 生成 containerd 默认配置
  command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: 写入 containerd 配置（启用 systemd cgroup）
  copy:
    content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: restart containerd

- name: 启动并启用 containerd
  systemd:
    name: containerd
    state: started
    enabled: true
