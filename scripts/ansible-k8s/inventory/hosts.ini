# ============================================================
# Kubernetes 集群主机清单
# 使用说明：
#   1. 修改下面的 IP 为你实际的节点地址
#   2. ansible_user 改为你 SSH 登录的用户（需有 sudo 权限）
#   3. 多 master 高可用：把第二台 master 也加入 [masters] 组
# ============================================================

[all:vars]
ansible_user=root
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# ===== 控制平面（master）=====
# 第一台 master 会被 kubeadm init 初始化
# 后续 master 通过 kubeadm join --control-plane 加入（高可用）
[masters]
k8s-master-1 ansible_host=192.168.1.101

# ===== 工作节点（worker）=====
[workers]
k8s-worker-1 ansible_host=192.168.1.102
k8s-worker-2 ansible_host=192.168.1.103

# ===== 逻辑分组 =====
[k8s_cluster:children]
masters
workers
